<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bulk URL Opener</title>
  <script>
    // URLs ki list yahan paste kar di
    const urls = [
      "https://www.amazon.in/dp/B0B7MP5TX6",
      "https://www.amazon.in/dp/B0B7MSH7B3",
      "https://www.amazon.in/dp/B0B7DB34W8",
      "https://www.amazon.in/dp/B0B7MSCJG3",
      "https://www.amazon.in/dp/B0B7DN5CNM",
      "https://www.amazon.in/dp/B0B7MQZBMK",
      "https://www.amazon.in/dp/B0B1TVYKWX",
      "https://www.amazon.in/dp/B0B1TKTF4F",
      "https://www.amazon.in/dp/B0B1TRG9VD",
      "https://www.amazon.in/dp/B0B1T32QFB",
      "https://www.amazon.in/dp/B09PMWLMMW",
      "https://www.amazon.in/dp/B09PMVP8K7",
      "https://www.amazon.in/dp/B09PMW3FV1",
      "https://www.amazon.in/dp/B09PMLM1DF",
      "https://www.amazon.in/dp/B09PMKPFN1",
      "https://www.amazon.in/dp/B09PMRW45F"
    ];

    function openUrls() {
      urls.forEach(url => {
        window.open(url, '_blank');
      });
    }

    window.onload = () => {
      // Browser popup blocker ko avoid karne ke liye ek button de rahe hain
      const btn = document.getElementById('openBtn');
      btn.style.display = 'inline-block';
      btn.onclick = () => {
        openUrls();
        btn.style.display = 'none';
      };
    }
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #openBtn {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #0073bb;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Bulk URL Opener</h1>
  <p>Click the button below to open all URLs in new tabs.</p>
  <button id="openBtn" style="display:none;">Open All URLs</button>
</body>
</html>
